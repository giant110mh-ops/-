<meta name="theme-color" content="#8C5F1E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --paper:#EEF1EC;
  --paper-line:rgba(22,35,46,0.05);
  --ink:#16232E;
  --ink-soft:#5B6B70;
  --ink-faint:#8B9A9E;
  --amber:#B9812C;
  --amber-deep:#8C5F1E;
  --amber-soft:#F1E1BE;
  --danger:#A8433D;
  --danger-soft:#F1DAD6;
  --success:#3F7859;
  --success-soft:#DCE8DF;
  --card:#FBFAF5;
  --border:#D9DCD2;
  --shadow:0 2px 14px rgba(22,35,46,0.09);
  --radius:8px;
  --font-display:'Shippori Mincho', serif;
  --font-body:'Noto Sans JP', sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--paper-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper-line) 1px, transparent 1px);
  background-size:28px 28px;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}

button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}

/* ---------- Header ---------- */
.topbar{
  padding:28px 32px 18px;
  border-bottom:2px solid var(--ink);
  background:linear-gradient(180deg, rgba(251,250,245,0.7), rgba(251,250,245,0));
}
.topbar-row{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}
.brand-eyebrow{
  font-family:var(--font-mono);
  font-size:11px;
  letter-spacing:0.18em;
  color:var(--amber-deep);
  margin:0 0 4px;
}
.brand-title{
  font-family:var(--font-display);
  font-size:32px;
  font-weight:700;
  margin:0;
  letter-spacing:0.02em;
}
.brand-sub{
  font-size:12.5px;
  color:var(--ink-soft);
  margin:6px 0 0;
}
.stats-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.stat-chip{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:8px 14px;
  min-width:92px;
  text-align:center;
  box-shadow:var(--shadow);
}
.stat-chip .num{
  font-family:var(--font-mono);
  font-size:19px;
  font-weight:600;
  display:block;
  line-height:1.2;
}
.stat-chip .lbl{
  font-size:10.5px;
  color:var(--ink-soft);
  letter-spacing:0.03em;
}
.stat-chip.warn .num{color:var(--danger);}

/* ---------- Tabs ---------- */
.tabbar{
  display:flex;
  gap:2px;
  padding:0 32px;
  margin-top:16px;
}
.tab-btn{
  font-family:var(--font-display);
  font-size:15px;
  font-weight:600;
  background:transparent;
  border:none;
  padding:10px 18px 12px;
  color:var(--ink-soft);
  border-bottom:3px solid transparent;
}
.tab-btn.active{
  color:var(--ink);
  border-bottom-color:var(--amber-deep);
}
.tab-btn:hover{color:var(--ink);}
.tab-btn .count{
  font-family:var(--font-mono);
  font-size:11px;
  color:var(--ink-faint);
  margin-left:4px;
}

/* ---------- Toolbar ---------- */
.toolbar{
  padding:16px 32px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
}
.toolbar-left{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.field-input, .field-select{
  border:1px solid var(--border);
  background:var(--card);
  border-radius:6px;
  padding:8px 10px;
  font-size:13px;
  color:var(--ink);
}
.field-input{min-width:240px;}
.field-input:focus, .field-select:focus{outline:2px solid var(--amber-soft); border-color:var(--amber);}

.search-wrap{position:relative; display:inline-flex; align-items:center;}
.search-wrap svg{
  position:absolute; left:14px;
  width:17px; height:17px;
  stroke:var(--ink-faint);
  pointer-events:none;
}
#searchInput{
  min-width:320px;
  border:2px solid var(--ink);
  background:var(--card);
  border-radius:8px;
  padding:11px 14px 11px 40px;
  font-size:14.5px;
  font-weight:500;
  color:var(--ink);
  box-shadow:var(--shadow);
}
#searchInput::placeholder{color:var(--ink-faint); font-weight:400;}
#searchInput:focus{
  outline:none;
  border-color:var(--amber-deep);
  box-shadow:0 0 0 3px var(--amber-soft), var(--shadow);
}
@media (max-width: 720px){
  #searchInput{min-width:0; width:100%;}
}

.btn{
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  padding:9px 16px;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
  letter-spacing:0.02em;
  transition:transform .08s ease, opacity .15s ease;
}
.btn:hover{opacity:0.86;}
.btn:active{transform:translateY(1px);}
.btn.secondary{
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--border);
}
.btn.amber{background:var(--amber-deep); border-color:var(--amber-deep); color:#fff;}
.btn.danger{background:var(--danger); border-color:var(--danger); color:#fff;}
.btn.ghost{background:transparent;border:1px solid transparent;color:var(--ink-soft); padding:6px 10px;}
.btn.ghost:hover{color:var(--ink); text-decoration:underline;}
.btn:focus-visible, .field-input:focus-visible, .field-select:focus-visible, .icon-btn:focus-visible{outline:2px solid var(--amber-deep); outline-offset:2px;}

/* ---------- Table ---------- */
main{padding:0 32px 60px;}
.table-wrap{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  overflow:hidden;
  box-shadow:var(--shadow);
}
table{width:100%; border-collapse:collapse; font-size:13px;}
thead th{
  text-align:left;
  font-size:11px;
  letter-spacing:0.05em;
  color:var(--ink-soft);
  font-weight:600;
  padding:12px 14px;
  border-bottom:2px solid var(--ink);
  white-space:nowrap;
}
tbody td{
  padding:12px 14px;
  border-bottom:1px solid var(--border);
  vertical-align:middle;
}
tbody tr{cursor:pointer; transition:background .1s ease;}
tbody tr:hover{background:#F3F1E9;}
tbody tr:last-child td{border-bottom:none;}
.name-cell .jname{font-weight:600;}
.name-cell .cas{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);}
.qty-cell{font-family:var(--font-mono); font-weight:600;}
.code-cell{font-family:var(--font-mono); font-size:11.5px; color:var(--ink-soft);}
.badge{
  display:inline-block;
  font-size:11px;
  padding:3px 9px;
  border-radius:20px;
  font-weight:600;
  letter-spacing:0.02em;
  white-space:nowrap;
}
.badge.ok{background:var(--success-soft); color:var(--success);}
.badge.zero{background:var(--ink); color:var(--paper);}
.badge.disposed{background:var(--danger-soft); color:var(--danger);}
.hazard-mark{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:19px; height:19px;
  border-radius:50%;
  background:var(--danger);
  color:#fff;
  font-size:11px;
  font-weight:700;
  font-family:var(--font-display);
  margin-right:6px;
  flex-shrink:0;
  vertical-align:middle;
}
tbody tr.row-hazard{background:#F1EAF8;}
tbody tr.row-hazard:hover{background:#E9DEF4;}
.empty-state{
  padding:80px 20px;
  text-align:center;
  color:var(--ink-soft);
}
.empty-state .big{font-family:var(--font-display); font-size:22px; color:var(--ink); margin-bottom:6px;}

/* ---------- Overlay / Modal / Drawer ---------- */
.overlay{
  position:fixed; inset:0;
  background:rgba(22,35,46,0.45);
  display:flex; align-items:stretch; justify-content:flex-end;
  z-index:50;
}
.overlay.center{align-items:center; justify-content:center;}
.drawer{
  width:min(560px, 100%);
  background:var(--paper);
  height:100%;
  overflow-y:auto;
  box-shadow:-8px 0 30px rgba(0,0,0,0.2);
  animation:slideIn .18s ease;
}
@keyframes slideIn{from{transform:translateX(24px); opacity:0;} to{transform:translateX(0); opacity:1;}}
.modal{
  width:min(540px, 92vw);
  max-height:88vh;
  overflow-y:auto;
  background:var(--paper);
  border-radius:12px;
  box-shadow:0 12px 40px rgba(0,0,0,0.25);
  animation:pop .15s ease;
}
@keyframes pop{from{transform:scale(0.97); opacity:0;} to{transform:scale(1); opacity:1;}}
.panel-head{
  padding:22px 26px 16px;
  border-bottom:2px solid var(--ink);
  display:flex; justify-content:space-between; align-items:flex-start;
  position:sticky; top:0; background:var(--paper); z-index:2;
}
.panel-head h2{font-family:var(--font-display); font-size:22px; margin:0;}
.panel-head .sub{font-size:11.5px; color:var(--ink-soft); font-family:var(--font-mono); margin-top:4px;}
.icon-btn{
  background:none; border:none; font-size:20px; line-height:1; color:var(--ink-soft); padding:4px;
}
.icon-btn:hover{color:var(--ink);}
.panel-body{padding:20px 26px 30px;}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid.single{grid-template-columns:1fr;}
.form-field{display:flex; flex-direction:column; gap:5px;}
.form-field.span2{grid-column:1 / -1;}
.form-field label{font-size:11.5px; font-weight:600; color:var(--ink-soft); letter-spacing:0.02em;}
.form-field input, .form-field select, .form-field textarea{
  border:1px solid var(--border);
  border-radius:6px;
  padding:9px 10px;
  font-size:13.5px;
  background:var(--card);
  color:var(--ink);
}
.form-field textarea{resize:vertical; min-height:56px;}
.form-actions{
  display:flex; justify-content:flex-end; gap:8px; margin-top:20px;
  border-top:1px dashed var(--border); padding-top:16px;
}
.hint{font-size:11px; color:var(--ink-faint); margin-top:2px;}

/* Detail drawer specifics */
.detail-section{margin-bottom:22px;}
.detail-section h3{
  font-family:var(--font-display);
  font-size:15px; margin:0 0 10px;
  border-bottom:1px solid var(--border);
  padding-bottom:6px;
}
.kv-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px 18px;}
.kv{font-size:13px;}
.kv .k{color:var(--ink-soft); font-size:11px; letter-spacing:0.02em;}
.kv .v{font-weight:500;}
.kv .v.mono{font-family:var(--font-mono);}
.qty-hero{
  display:flex; align-items:baseline; gap:8px;
  background:var(--card); border:1px solid var(--border); border-radius:8px;
  padding:14px 18px; margin-bottom:18px;
}
.qty-hero .n{font-family:var(--font-mono); font-size:30px; font-weight:600;}
.qty-hero .u{font-size:14px; color:var(--ink-soft);}
.drawer-actions{display:flex; gap:8px; margin-bottom:22px; flex-wrap:wrap;}

.timeline{list-style:none; margin:0; padding:0;}
.timeline li{
  display:flex; gap:12px; padding:12px 0;
  border-bottom:1px solid var(--border);
}
.timeline li:last-child{border-bottom:none;}
.stamp{
  flex-shrink:0;
  width:52px; height:52px; border-radius:50%;
  border:2.5px solid;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:12px;
  transform:rotate(-8deg);
  letter-spacing:0.02em;
}
.stamp.in{border-color:var(--success); color:var(--success);}
.stamp.out{border-color:var(--danger); color:var(--danger);}
.tl-body{flex:1; font-size:12.5px;}
.tl-body .line1{font-weight:600; display:flex; justify-content:space-between; gap:8px;}
.tl-body .line1 .amt{font-family:var(--font-mono);}
.tl-body .meta{color:var(--ink-soft); margin-top:3px; line-height:1.6;}
.empty-timeline{color:var(--ink-faint); font-size:12.5px; padding:14px 0;}

footer.appfoot{
  text-align:center; padding:24px; color:var(--ink-faint); font-size:11px;
}

@media (max-width: 720px){
  .topbar, .toolbar, .tabbar, main{padding-left:16px; padding-right:16px;}
  .form-grid{grid-template-columns:1fr;}
  .kv-grid{grid-template-columns:1fr;}
  table, thead, tbody, tr{display:block;}
  thead{display:none;}
  tbody tr{
    border-bottom:2px solid var(--border);
    padding:10px 4px;
  }
  tbody td{display:flex; justify-content:space-between; border-bottom:none; padding:6px 10px; gap:10px;}
  tbody td::before{content:attr(data-label); font-size:10.5px; color:var(--ink-soft); font-weight:600;}
}
[hidden]{display:none !important;}
</style>
</head>

</div>

<div class="overlay center" id="formOverlay" hidden>

</div>

<div class="overlay center" id="txOverlay" hidden>

/* ---------------- Storage ---------------- */
/* window.storage only exists when this page is opened via a published/shared
   Claude link. A downloaded copy opened directly in a browser has no such
   API, so we fall back to this browser's localStorage in that case. */
const LOCAL_FALLBACK_KEY = 'reagent-inventory-local-' + STORAGE_KEY;
let usingLocalFallback = false;

function hasClaudeStorage(){
  return typeof window.storage !== 'undefined'
    && window.storage !== null
    && typeof window.storage.get === 'function'
    && typeof window.storage.set === 'function';
}

function showStorageNotice(message){
  let el = document.getElementById('storageNotice');
  if(!el){
    el = document.createElement('div');
    el.id = 'storageNotice';
    el.style.cssText = 'position:fixed; left:0; right:0; bottom:0; z-index:200; background:var(--danger); color:#fff; font-size:12.5px; text-align:center; padding:9px 14px;';
    document.body.appendChild(el);
  }
  el.textContent = message;
  el.hidden = false;
}

async function loadData(){
  usingLocalFallback = !hasClaudeStorage();

  try{
    if(usingLocalFallback){
      const raw = localStorage.getItem(LOCAL_FALLBACK_KEY);
      if(raw){
        state = JSON.parse(raw);
        state.items = state.items || [];
      } else {
        state = { items: [], seeded: false };
      }
    } else {
      const res = await window.storage.get(STORAGE_KEY, true);
      if(res && res.value){
        state = JSON.parse(res.value);
        state.items = state.items || [];
      } else {
        state = { items: [], seeded: false };
      }
    }
  }catch(e){
    console.error('読み込みに失敗しました', e);
    state = { items: [], seeded: false };
  }

  if(!state.seeded){
    SEED_ACTIVE.forEach(r => {
      state.items.push(Object.assign({ id: uid('it'), status: 'active' }, r));
    });
    SEED_PENDING.forEach(r => {
      state.items.push(Object.assign({ id: uid('it'), status: 'pending' }, r));
    });
    SEED_DISPOSED.forEach(t => {
      state.items.push({
        id: uid('it'),
        status: 'disposed',
        nameJa: t.nameJa, nameEn: t.nameEn, casNumber: t.casNumber,
        qrCode: t.qrCode, productCode: t.productCode, manufacturer: t.manufacturer,
        storageLocation: t.storageLocation, quantity: t.quantity, unit: t.unit,
        registeredDate: t.date || t.registeredDate || '',
        registeredBy: t.handledBy || t.registeredBy || '',
      });
    });
    state.seeded = true;
    await saveData();
  }

  if(usingLocalFallback){
    showStorageNotice('このページは「ダウンロードしたファイル」として開かれているため、データはこのブラウザだけに保存されます（研究室メンバーとは共有されません）。共有するにはClaude上で公開・共有したリンクを開いてください。');
  }
}

async function saveData(){
  try{
    if(usingLocalFallback){
      localStorage.setItem(LOCAL_FALLBACK_KEY, JSON.stringify(state));
    } else {
      const result = await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
      if(!result){
        throw new Error('storage.set returned no result');
      }
    }
  }catch(e){
    console.error('保存に失敗しました', e);
    showStorageNotice('データの保存に失敗しました。インターネット接続を確認して、もう一度操作をお試しください。');
  }
}

function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function todayStr(){
  return new Date().toISOString().slice(0,10);
}
function fmtDate(d){
  if(!d) return '—';
  return d;
}

/* ---------------- Hazard location ---------------- */
function isHazardLocation(storageLocation){
  if(!storageLocation) return false;
  return /[酸毒劇]/.test(storageLocation);
}
function hazardMark(storageLocation){
  return isHazardLocation(storageLocation) ? '<span class="hazard-mark" title="保管場所に酸・毒・劇の表記あり">毒</span>' : '';
}

/* ---------------- Rendering: stats ---------------- */
function renderStats(){
  const total = state.items.filter(r => r.status === 'active').length;

  const chips = [
    {num: total, lbl:'登録試薬数', cls:''},
  ];
  document.getElementById('statsRow').innerHTML = chips.map(c => `
    <div class="stat-chip ${c.cls}">
      <span class="num">${c.num}</span>
      <span class="lbl">${c.lbl}</span>
    </div>
  `).join('');

  document.getElementById('countActive').textContent = `(${state.items.filter(r=>r.status==='active').length})`;
  document.getElementById('countDisposed').textContent = `(${state.items.filter(r=>r.status==='disposed').length})`;
  document.getElementById('countPending').textContent = `(${state.items.filter(r=>r.status==='pending').length})`;
}

/* ---------------- Tabs ---------------- */
document.getElementById('tabActive').addEventListener('click', () => switchTab('active'));
document.getElementById('tabDisposed').addEventListener('click', () => switchTab('disposed'));
document.getElementById('tabPending').addEventListener('click', () => switchTab('pending'));
function switchTab(tab){
  currentTab = tab;
  document.getElementById('tabActive').classList.toggle('active', tab==='active');
  document.getElementById('tabDisposed').classList.toggle('active', tab==='disposed');
  document.getElementById('tabPending').classList.toggle('active', tab==='pending');
  populateSortOptions();
  renderTable();
}

/* ---------------- Sorting ---------------- */
const SORT_OPTIONS = [
  {v:'nameAsc', l:'並び順：品名（あ→ん）'},
  {v:'nameDesc', l:'並び順：品名（ん→あ）'},
  {v:'regDateDesc', l:'並び順：日付が新しい順'},
  {v:'regDateAsc', l:'並び順：日付が古い順'},
  {v:'cas', l:'並び順：CAS番号順'},
  {v:'manufacturer', l:'並び順：メーカー順'},
  {v:'location', l:'並び順：保管場所順'},
  {v:'qtyDesc', l:'並び順：容量が多い順'},
  {v:'qtyAsc', l:'並び順：容量が少ない順'},
];
function populateSortOptions(){
  const sel = document.getElementById('sortSelect');
  const current = sel.value;
  sel.innerHTML = SORT_OPTIONS.map(o => `<option value="${o.v}">${o.l}</option>`).join('');
  sel.value = SORT_OPTIONS.some(o => o.v === current) ? current : SORT_OPTIONS[0].v;
}
function compareStr(a, b){
  return (a||'').localeCompare(b||'', 'ja');
}
function compareDate(a, b){
  const ta = a ? new Date(a).getTime() : -Infinity;
  const tb = b ? new Date(b).getTime() : -Infinity;
  return ta - tb;
}
function sortItems(list, sortValue){
  const sorted = list.slice();
  switch(sortValue){
    case 'nameAsc': sorted.sort((a,b) => compareStr(a.nameJa, b.nameJa)); break;
    case 'nameDesc': sorted.sort((a,b) => compareStr(b.nameJa, a.nameJa)); break;
    case 'regDateDesc': sorted.sort((a,b) => compareDate(b.registeredDate, a.registeredDate)); break;
    case 'regDateAsc': sorted.sort((a,b) => compareDate(a.registeredDate, b.registeredDate)); break;
    case 'cas': sorted.sort((a,b) => compareStr(a.casNumber, b.casNumber)); break;
    case 'manufacturer': sorted.sort((a,b) => compareStr(a.manufacturer, b.manufacturer)); break;
    case 'location': sorted.sort((a,b) => compareStr(a.storageLocation, b.storageLocation)); break;
    case 'qtyDesc': sorted.sort((a,b) => Number(b.quantity||0) - Number(a.quantity||0)); break;
    case 'qtyAsc': sorted.sort((a,b) => Number(a.quantity||0) - Number(b.quantity||0)); break;
    default: sorted.sort((a,b) => compareStr(a.nameJa, b.nameJa));
  }
  return sorted;
}

/* ---------------- Filters ---------------- */
function populateManufacturerFilter(){
  const sel = document.getElementById('filterManufacturer');
  const current = sel.value;
  const source = state.items.filter(r => r.status === currentTab);
  const list = Array.from(new Set(source.map(r => r.manufacturer).filter(Boolean))).sort((a,b)=>a.localeCompare(b,'ja'));
  sel.innerHTML = '<option value="">メーカー：すべて</option>' + list.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');
  sel.value = current;
}

function matchesSearch(item, q){
  if(!q) return true;
  const hay = [item.nameJa, item.nameEn, item.casNumber].join(' ').toLowerCase();
  return hay.includes(q);
}

function getFilteredByStatus(status){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const manufacturer = document.getElementById('filterManufacturer').value;
  const sortValue = document.getElementById('sortSelect').value;

  const filtered = state.items.filter(r => {
    if(r.status !== status) return false;
    if(!matchesSearch(r, q)) return false;
    if(manufacturer && r.manufacturer !== manufacturer) return false;
    return true;
  });
  return sortItems(filtered, sortValue);
}

/* ---------------- Rendering: table ---------------- */
function renderTable(){
  populateManufacturerFilter();
  renderItemsTable(currentTab);
}

function renderItemsTable(status){
  const dateLabel = DATE_LABEL[status];
  document.getElementById('tableHead').innerHTML = `
    <tr>
      <th>日本語名 / 英語名</th>
      <th>CAS番号</th>
      <th>商品コード / QRコード</th>
      <th>メーカー</th>
      <th>保管場所</th>
      <th>容量</th>
      <th>${dateLabel} / 登録者</th>
    </tr>`;

  const all = state.items.filter(r => r.status === status);
  const list = getFilteredByStatus(status);
  const tbody = document.getElementById('tableBody');
  const empty = document.getElementById('emptyState');

  const emptyMessages = {
    active: ['登録された試薬がありません', '「＋ 新規試薬登録」から最初の試薬を登録してください。'],
    pending: ['保留中の試薬はありません', '試薬の詳細画面から「保留に移動」すると、ここに表示されます。'],
    disposed: ['廃棄記録はまだありません', '試薬の詳細画面から「廃棄に移動」すると、ここに表示されます。'],
  };

  if(all.length === 0){
    tbody.innerHTML = '';
    empty.hidden = false;
    empty.innerHTML = `<div class="big">${emptyMessages[status][0]}</div><div>${emptyMessages[status][1]}</div>`;
    return;
  }
  empty.hidden = true;

  if(list.length === 0){
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--ink-faint);">条件に一致する試薬がありません</td></tr>`;
    return;
  }

  tbody.innerHTML = list.map(r => `
    <tr data-id="${r.id}" class="${isHazardLocation(r.storageLocation) ? 'row-hazard' : ''}">
      <td data-label="品名">
        <div class="name-cell">
          <div class="jname">${hazardMark(r.storageLocation)}${escapeHtml(r.nameJa || '(名称未設定)')}</div>
          <div class="cas">${escapeHtml(r.nameEn || '')}</div>
        </div>
      </td>
      <td data-label="CAS番号" class="code-cell">${escapeHtml(r.casNumber || '—')}</td>
      <td data-label="商品コード/QR" class="code-cell">${escapeHtml(r.productCode || '—')}<br>${escapeHtml(r.qrCode || '—')}</td>
      <td data-label="メーカー">${escapeHtml(r.manufacturer || '—')}</td>
      <td data-label="保管場所">${escapeHtml(r.storageLocation || '—')}</td>
      <td data-label="容量" class="qty-cell">${formatQty(r.quantity)} ${escapeHtml(r.unit||'')}</td>
      <td data-label="${dateLabel}/登録者" class="code-cell">${fmtDate(r.registeredDate)}<br>${escapeHtml(r.registeredBy || '—')}</td>
    </tr>
  `).join('');

  tbody.querySelectorAll('tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => openDetail(tr.dataset.id));
  });
}

function formatQty(q){
  const n = Number(q);
  if(Number.isInteger(n)) return n.toString();
  return n.toFixed(2).replace(/\.?0+$/,'');
}

function escapeHtml(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function refreshAll(){
  renderStats();
  renderTable();
}

          ? `<button class="btn" style="background:var(--danger); border-color:var(--danger); color:#fff;" data-move="${s}">廃棄</button>`
          : `<button class="btn secondary" data-move="${s}">${STATUS_LABEL[s]}に移動</button>`
        ).join('')}

        <button class="btn ghost" data-action="delete">削除</button>
      </div>

      <div class="detail-section">
        <h3>詳細情報</h3>
        <div class="kv-grid">
          <div class="kv"><div class="k">日本語名</div><div class="v">${escapeHtml(r.nameJa || '—')}</div></div>
          <div class="kv"><div class="k">英語名</div><div class="v">${escapeHtml(r.nameEn || '—')}</div></div>
          <div class="kv"><div class="k">CAS番号</div><div class="v mono">${escapeHtml(r.casNumber || '—')}</div></div>
          <div class="kv"><div class="k">QRコード番号</div><div class="v mono">${escapeHtml(r.qrCode || '—')}</div></div>
          <div class="kv"><div class="k">商品コード</div><div class="v mono">${escapeHtml(r.productCode || '—')}</div></div>
          <div class="kv"><div class="k">メーカー</div><div class="v">${escapeHtml(r.manufacturer || '—')}</div></div>
          <div class="kv"><div class="k">保管場所</div><div class="v">${escapeHtml(r.storageLocation || '—')}</div></div>
          <div class="kv"><div class="k">容量</div><div class="v mono">${formatQty(r.quantity)} ${escapeHtml(r.unit||'')}</div></div>
          <div class="kv"><div class="k">${dateLabel}</div><div class="v mono">${fmtDate(r.registeredDate)}</div></div>
          <div class="kv"><div class="k">登録者</div><div class="v">${escapeHtml(r.registeredBy || '—')}</div></div>
        </div>
      </div>
    </div>
  `;

  drawer.querySelector('#closeDrawer').addEventListener('click', closeDrawer);
  drawer.querySelector('[data-action="stockin"]').addEventListener('click', () => openReagentForm(null, r));
  drawer.querySelectorAll('[data-move]').forEach(btn => {
    btn.addEventListener('click', () => openMoveForm(id, btn.dataset.move));
  });
  drawer.querySelector('[data-action="edit"]').addEventListener('click', () => openReagentForm(r));
  drawer.querySelector('[data-action="delete"]').addEventListener('click', () => deleteReagent(id));

  document.getElementById('drawerOverlay').hidden = false;
}

function closeDrawer(){
  document.getElementById('drawerOverlay').hidden = true;
}
document.getElementById('drawerOverlay').addEventListener('click', (e) => {

});

/* ---------------- Reagent Form (create / edit) ---------------- */
function openReagentForm(existing, prefillFrom){
  const isEdit = !!existing;
  const isStockIn = !isEdit && !!prefillFrom;
  const r = existing || (prefillFrom ? {
    nameJa: prefillFrom.nameJa,
    nameEn: prefillFrom.nameEn,
    casNumber: prefillFrom.casNumber,
    qrCode: '',
    productCode: prefillFrom.productCode,
    manufacturer: prefillFrom.manufacturer,
    storageLocation: prefillFrom.storageLocation,
    quantity: prefillFrom.quantity,
    unit: prefillFrom.unit,
    registeredDate: '',
    registeredBy: '',
  } : {});
  const modal = document.getElementById('formModal');

  modal.innerHTML = `
    <div class="panel-head">
      <div>
        <h2>${isEdit ? '試薬情報を編集' : isStockIn ? '入荷登録' : '新規試薬登録'}</h2>
        ${isStockIn ? `<div class="sub">${escapeHtml(prefillFrom.nameJa)} の新しいボトルを登録します。QRコード番号・登録日・登録者を入力してください。</div>` : ''}
      </div>
      <button class="icon-btn" id="closeForm" aria-label="閉じる">✕</button>
    </div>
    <div class="panel-body">
      <form id="reagentForm">
        <div class="form-grid">
          <div class="form-field">
            <label>日本語名 *</label>
            <input required name="nameJa" value="${escapeHtml(r.nameJa||'')}" placeholder="例：塩化ナトリウム">
          </div>
          <div class="form-field">
            <label>英語名</label>
            <input name="nameEn" value="${escapeHtml(r.nameEn||'')}" placeholder="例：Sodium Chloride">
          </div>
          <div class="form-field">
            <label>CAS番号</label>
            <input name="casNumber" value="${escapeHtml(r.casNumber||'')}" placeholder="例：7647-14-5">
          </div>
          <div class="form-field">
            <label>QRコード番号${isStockIn ? ' *' : ''}</label>
            <input ${isStockIn?'required':''} name="qrCode" value="${escapeHtml(r.qrCode||'')}" placeholder="ラベルのQRコード値">
          </div>
          <div class="form-field">
            <label>商品コード</label>
            <input name="productCode" value="${escapeHtml(r.productCode||'')}">
          </div>
          <div class="form-field">
            <label>メーカー</label>
            <input name="manufacturer" value="${escapeHtml(r.manufacturer||'')}">
          </div>
          <div class="form-field span2">
            <label>保管場所</label>
            <input name="storageLocation" value="${escapeHtml(r.storageLocation||'')}" placeholder="例：薬品棚A-3">
          </div>
          <div class="form-field">
            <label>容量 *</label>
            <input required type="number" step="any" min="0" name="quantity" value="${r.quantity ?? ''}">
          </div>
          <div class="form-field">
            <label>容量の単位 *</label>
            <select required name="unit">
              <option value="">選択</option>
              ${UNITS.map(u => `<option value="${u}" ${r.unit===u?'selected':''}>${u}</option>`).join('')}
            </select>
          </div>
          <div class="form-field">
            <label>登録日 *</label>
            <input required type="date" name="registeredDate" value="${r.registeredDate || todayStr()}">
          </div>
          <div class="form-field">
            <label>登録者 *</label>
            <input required name="registeredBy" value="${escapeHtml(r.registeredBy||'')}">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn secondary" id="cancelForm">キャンセル</button>
          <button type="submit" class="btn amber">${isEdit ? '保存する' : isStockIn ? '入荷を登録' : '登録する'}</button>
        </div>
      </form>
    </div>
  `;

  modal.querySelector('#closeForm').addEventListener('click', closeFormModal);
  modal.querySelector('#cancelForm').addEventListener('click', closeFormModal);
  modal.querySelector('#reagentForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
      nameJa: fd.get('nameJa').trim(),
      nameEn: fd.get('nameEn').trim(),
      casNumber: fd.get('casNumber').trim(),
      qrCode: fd.get('qrCode').trim(),
      productCode: fd.get('productCode').trim(),
      manufacturer: fd.get('manufacturer').trim(),
      storageLocation: fd.get('storageLocation').trim(),
      quantity: parseFloat(fd.get('quantity')),
      unit: fd.get('unit'),
      registeredDate: fd.get('registeredDate'),
      registeredBy: fd.get('registeredBy').trim(),
    };

    let newId = null;
    if(isEdit){
      Object.assign(r, data);
    } else {
      data.id = uid('it');
      data.status = 'active';
      newId = data.id;
      state.items.push(data);
    }
    saveData().then(() => {
      closeFormModal();
      refreshAll();
      if(isEdit || isStockIn){

function closeFormModal(){

document.getElementById('formOverlay').addEventListener('click', (e) => {

});

document.getElementById('addReagentBtn').addEventListener('click', () => openReagentForm(null));

  if(!r) return;
  const modal = document.getElementById('txModal');
  const dateLabel = DATE_LABEL[targetStatus];

  modal.innerHTML = `
    <div class="panel-head">
      <div>
        <h2>${STATUS_LABEL[targetStatus]}に移動</h2>
        <div class="sub">${escapeHtml(r.nameJa)} を「${STATUS_LABEL[r.status]}」から「${STATUS_LABEL[targetStatus]}」に移動します</div>
      </div>
      <button class="icon-btn" id="closeTx" aria-label="閉じる">✕</button>
    </div>
    <div class="panel-body">
      <form id="moveForm">
        <div class="form-grid">

function closeTxModal(){

}
document.getElementById('txOverlay').addEventListener('click', (e) => {
  if(e.target.id === 'txOverlay') closeTxModal();
});

/* ---------------- Delete ---------------- */
function deleteReagent(id){
  const r = state.items.find(x => x.id === id);
  if(!r) return;
  if(!confirm(`「${r.nameJa}」を削除します。よろしいですか？`)) return;
  state.items = state.items.filter(x => x.id !== id);
  saveData().then(() => {
    closeDrawer();
    refreshAll();
  });
}

/* ---------------- CSV export ---------------- */
function exportCsv(){
  const dateLabel = DATE_LABEL[currentTab];
  const headers = ['日本語名','英語名','CAS番号','QRコード番号','商品コード','メーカー','保管場所','容量','単位',dateLabel,'登録者'];
  const source = state.items.filter(r => r.status === currentTab);
  const rows = source.map(r => [
    r.nameJa, r.nameEn, r.casNumber, r.qrCode, r.productCode,
    r.manufacturer, r.storageLocation, r.quantity, r.unit, r.registeredDate, r.registeredBy
  ]);
  const label = STATUS_LABEL[currentTab] + '一覧';
  downloadCsv(headers, rows, `試薬台帳_${label}_${todayStr()}.csv`);
}
function downloadCsv(headers, rows, filename){
  const csvLines = [headers, ...rows].map(row =>
    row.map(v => {
      const s = (v == null ? '' : String(v)).replace(/"/g, '""');
      return /[",\n]/.test(s) ? `"${s}"` : s;
    }).join(',')
  );
  const csvContent = '\uFEFF' + csvLines.join('\r\n');
  const blob = new Blob([csvContent], {type: 'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('exportBtn').addEventListener('click', exportCsv);

/* ---------------- Duplicate reagents (使用中・保留のみ、廃棄は含めない) ---------------- */
function getDuplicateGroups(){
  const groups = new Map();
  state.items.filter(r => r.status !== 'disposed').forEach(r => {
    const key = (r.casNumber && r.casNumber.trim()) || (r.nameJa && r.nameJa.trim()) || r.id;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });
  return Array.from(groups.values())
    .filter(g => g.length > 1)
    .sort((a,b) => b.length - a.length);
}
function sourceBadge(status, label){
  const cls = status === 'disposed' ? 'disposed' : status === 'active' ? 'ok' : '';
  const style = status === 'pending' ? 'background:var(--amber-soft); color:var(--amber-deep);' : '';
  return `<span class="badge ${cls}" style="${style}">${label}</span>`;
}

            </thead>

              ${g.map(r => `

function closeDuplicates(){
